
name: Build Minify and Deploy
on: push
jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Cache Dependencies
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install Dependencies
        run: npm install
        
      - name: Build and Minify
        run: npm run build
        
      - name: Sync files
        uses: sand4rt/ftp-deployer@v1.8
        with:
           host: ${{ secrets.FTP_HOST }} #Without (s)ftp://
           sftp: true
           username: ${{ secrets.FTP_USER }}
           password: ${{ secrets.FTP_PASSWORD }}
           port: 22
           local_folder: / #current folder
           remote_folder: ${{ secrets.FTP_PATH }} #Something like /data/sites/web/stevejonkcom/subdomains/[SITE_NAME]/wp-content/themes/[THEME_FOLDER_NAME]
           exclude: "['node_modules/**', '.git/**', '*.env']"
